<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Shadow</title>
    <style>
        p {
            width: 100px;
            height: 100px;
            background-color: #e1ddda;
            margin: 20px;
            display: inline-block;
        }
        p.one {
            box-shadow: 0 0 0 0 ;
        }
        p.two {
            box-shadow: 5px 5px 5px 0px; color: #777777;
        }
        p.three {
            box-shadow: 5px 5px 5px 5px; color: #666666;
        }
        p.four {
            box-shadow: 0px 0px 3px 3px; color: #adadad;
        }
        p.five {
            box-shadow: inset 0 0 10px; color: #666666;
        }
    </style>
</head>
<body>
    <p class="one"></p>
    <p class="two"></p>
    <p class="three"></p>
    <br>
    <p class="four"></p>
    <p class="five"></p>
</body>
</html>
